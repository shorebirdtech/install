name: e2e

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: 📦 Install Shorebird CLI (bash)
        if: matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest'
        run: ./install.sh
        shell: bash

      - name: 📦 Install Shorebird CLI (powershell)
        if: matrix.os == 'windows-latest'
        run: ./install.ps1
        shell: pwsh

      - name: 🔁 Rerun installer (bash)
        if: matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set +e
          out=$(./install.sh 2>&1)
          code=$?
          echo "$out"
          [ $code -eq 1 ] && echo "$out" | grep -q "already installed"

      - name: 🔁 Rerun installer (powershell)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $out = ./install.ps1 | Out-String
          Write-Output $out
          if (-not $out.Contains("already installed")) { exit 1 }
